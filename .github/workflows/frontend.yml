name: Frontend

# Manual only while the GitHub account's Actions billing is locked (runs fail instantly
# and email on every push). Restore the push/pull_request triggers once it is cleared.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint --workspace frontend
      - run: npm test --workspace frontend
      - run: npm run build
