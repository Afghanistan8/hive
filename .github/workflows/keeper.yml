name: Keeper

# Manual HIVE keeper run inside GitHub Actions. Every transaction
# it sends is a permissionless call any wallet could make: open tomorrow's crypto
# markets, register BBC-verified fixtures, request AI Calls before kickoff,
# resolve what is ready, mark verified postponements. The keeper key has no
# special powers in the contracts.
#
# Repository → Settings → Secrets and variables → Actions → Secrets:
#   KEEPER_PRIVATE_KEY          raw key, OR the two keystore secrets below
#   KEEPER_KEYSTORE_JSON        contents of `genlayer account export --output ...`
#   KEEPER_KEYSTORE_PASSWORD    password chosen at export
#   SUPABASE_URL                optional read-mirror
#   SUPABASE_SERVICE_ROLE_KEY   optional read-mirror
# Without a key the job runs as a dry run (plans, signs nothing). Secrets are never
# printed and are not exposed to pull requests from forks (no pull_request_target).
# Scheduling now lives on Vercel Cron + an external scheduler (see DEPLOY.md);
# this workflow is kept for manual runs only.
on:
  workflow_dispatch:
    inputs:
      dry:
        description: "Plan only (no transactions)"
        type: boolean
        default: false

concurrency:
  group: hive-keeper
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run keeper
        working-directory: frontend
        env:
          KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
          KEEPER_KEYSTORE_JSON: ${{ secrets.KEEPER_KEYSTORE_JSON }}
          KEEPER_KEYSTORE_PASSWORD: ${{ secrets.KEEPER_KEYSTORE_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KEEPER_DRY: ${{ inputs.dry && '1' || '0' }}
        run: npm run keeper
