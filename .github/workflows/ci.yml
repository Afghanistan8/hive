name: CI

# Manual only while the GitHub account's Actions billing is locked (runs fail instantly
# and email on every push). Restore the push/pull_request triggers once it is cleared.
on:
  workflow_dispatch:

jobs:
  lint-contracts:
    name: Lint contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: genvm-lint check contracts/hive_crypto.py
      - run: genvm-lint check contracts/hive_sports.py

  test-direct:
    name: Direct mode tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest tests/direct/ -v
